<title>xanda-indica</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500&family=Manrope:wght@500;600;700;800&display=swap" rel="stylesheet">

<style>
  :root {
    --bg: #f6f1fb;
    --bg-glow: #ead9fa;
    --surface: #ffffff;
    --surface-border: #e6d9f5;
    --ink: #2b1a3d;
    --muted: #7c6a90;
    --accent: #7c4dbd;
    --accent-2: #a875e0;
    --accent-ink: #ffffff;
    --shadow: rgba(74, 42, 114, 0.16);
    --ring: rgba(124, 77, 189, 0.28);
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #170f22;
      --bg-glow: #2d1c46;
      --surface: #241733;
      --surface-border: #3c2853;
      --ink: #f3ecfb;
      --muted: #b7a0cf;
      --accent: #b088e8;
      --accent-2: #8a5cd6;
      --accent-ink: #1a0f2b;
      --shadow: rgba(0, 0, 0, 0.5);
      --ring: rgba(176, 136, 232, 0.3);
    }
  }

  :root[data-theme="dark"] {
    --bg: #170f22;
    --bg-glow: #2d1c46;
    --surface: #241733;
    --surface-border: #3c2853;
    --ink: #f3ecfb;
    --muted: #b7a0cf;
    --accent: #b088e8;
    --accent-2: #8a5cd6;
    --accent-ink: #1a0f2b;
    --shadow: rgba(0, 0, 0, 0.5);
    --ring: rgba(176, 136, 232, 0.3);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(circle at 50% -8%, var(--bg-glow), transparent 55%),
      var(--bg);
    color: var(--ink);
    font-family: "Manrope", ui-sans-serif, system-ui, -apple-system, sans-serif;
    display: flex;
    justify-content: center;
    padding: 56px 20px 64px;
  }

  .page {
    width: 100%;
    max-width: 420px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--surface-border);
    border-radius: 32px;
    padding: 40px 28px 32px;
    box-shadow: 0 24px 60px -24px var(--shadow);
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .avatar-wrap {
    width: 128px;
    height: 128px;
    border-radius: 50%;
    padding: 4px;
    background: conic-gradient(from 200deg, var(--accent), var(--accent-2), var(--accent));
    box-shadow: 0 10px 30px -10px var(--shadow);
    flex-shrink: 0;
  }

  .avatar {
    width: 100%;
    height: 100%;
    border-radius: 50%;
    object-fit: cover;
    display: block;
    border: 3px solid var(--surface);
  }

  .handle {
    margin: 20px 0 0;
    font-family: "Fraunces", ui-serif, Georgia, serif;
    font-style: italic;
    font-weight: 600;
    font-size: 1.7rem;
    letter-spacing: -0.01em;
    text-wrap: balance;
  }

  .tagline {
    margin: 6px 0 0;
    color: var(--muted);
    font-size: 0.94rem;
    font-weight: 500;
    max-width: 30ch;
  }

  .links {
    width: 100%;
    margin-top: 30px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .eyebrow {
    font-size: 0.72rem;
    font-weight: 700;
    letter-spacing: 0.14em;
    text-transform: uppercase;
    color: var(--accent);
    text-align: left;
    padding-left: 4px;
  }

  .link-card {
    display: flex;
    align-items: center;
    gap: 14px;
    width: 100%;
    padding: 16px 18px;
    border-radius: 20px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    color: var(--accent-ink);
    text-decoration: none;
    box-shadow: 0 14px 30px -14px var(--ring), 0 2px 8px -2px var(--shadow);
    transition: transform 0.18s ease, box-shadow 0.18s ease;
  }

  .link-card:hover {
    transform: translateY(-2px);
    box-shadow: 0 18px 36px -14px var(--ring), 0 4px 10px -2px var(--shadow);
  }

  .link-card:active {
    transform: translateY(0) scale(0.99);
  }

  .link-card:focus-visible {
    outline: 3px solid var(--accent-2);
    outline-offset: 3px;
  }

  .link-icon {
    width: 40px;
    height: 40px;
    border-radius: 50%;
    background: rgba(255, 255, 255, 0.22);
    display: flex;
    align-items: center;
    justify-content: center;
    flex-shrink: 0;
  }

  .link-icon svg { width: 20px; height: 20px; }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
    text-align: left;
    flex: 1;
    min-width: 0;
  }

  .link-title {
    font-weight: 800;
    font-size: 1.05rem;
    line-height: 1.2;
  }

  .link-sub {
    font-weight: 500;
    font-size: 0.82rem;
    opacity: 0.92;
    line-height: 1.3;
  }

  .link-chevron {
    flex-shrink: 0;
    opacity: 0.85;
  }

  .link-chevron svg { width: 18px; height: 18px; display: block; }

  .footer-note {
    margin-top: 26px;
    font-size: 0.78rem;
    color: var(--muted);
  }

  @media (prefers-reduced-motion: reduce) {
    .link-card { transition: none; }
  }
</style>
</head>
